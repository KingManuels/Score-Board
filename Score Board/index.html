<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div>
        <h2>HOME</h2>
        <h1 id="home-count" class="scores">12</h1>
        <div class="counter-pane">
          <button id="plus1H" class="counter" onclick="add1H()">+1</button>
          <button id="plus2H" class="counter" onclick="add2H()">+2</button>
          <button id="plus3H" class="counter" onclick="add3H()">+3</button>
        </div>
      </div>
      <div>
        <h2>AWAY</h2>
        <h1 id="away-count" class="scores">5</h1>
        <div class="counter-pane">
          <button id="plus1A" class="counter" onclick="add1A()">+1</button>
          <button id="plus2a" class="counter" onclick="add2A()">+2</button>
          <button id="plus3A" class="counter" onclick="add3A()">+3</button>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
